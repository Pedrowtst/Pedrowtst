name: Refresh profile

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.py
      - profile_data.py
      - tests/**
      - .github/workflows/update-readme.yml
  pull_request:
    paths:
      - generate.py
      - profile_data.py
      - tests/**
      - .github/workflows/update-readme.yml

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python generate.py

  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contribution calendar and generate assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python generate.py --refresh
      - name: Commit changed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ cache/data.json
          if git diff --staged --quiet; then
            echo "Profile assets are already current."
          else
            git commit -m "chore: refresh profile contribution calendar"
            git push
          fi
