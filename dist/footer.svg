<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E3FE" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E3FE" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00E3FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040407"/>
      <stop offset="100%" stop-color="#080912"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" fill="url(#bg)" />

  <g opacity="0.9">
    <path fill="url(#wave1)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="
          M0 0 L0 60 Q300 100 600 50 T1200 70 L1200 0 Z;
          M0 0 L0 45 Q300 30 600 80 T1200 45 L1200 0 Z;
          M0 0 L0 70 Q300 60 600 30 T1200 80 L1200 0 Z;
          M0 0 L0 60 Q300 100 600 50 T1200 70 L1200 0 Z"
      />
    </path>
    <path fill="url(#wave2)">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="
          M0 0 L0 40 Q400 20 700 70 T1200 35 L1200 0 Z;
          M0 0 L0 65 Q400 80 700 30 T1200 60 L1200 0 Z;
          M0 0 L0 35 Q400 50 700 80 T1200 40 L1200 0 Z;
          M0 0 L0 40 Q400 20 700 70 T1200 35 L1200 0 Z"
      />
    </path>
  </g>
</svg>