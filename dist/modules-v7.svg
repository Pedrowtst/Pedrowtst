<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <linearGradient id="cardTopBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E3FE" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E3FE" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="cardGridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#101726" stroke-width="0.5"/>
    </pattern>
  </defs>

  <style>
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #FFFFFF;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.45;
      fill: #94A3B8;
    }
    .tag-text {
      font-family: 'Fira Code', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #38BDF8;
    }
  </style>

  <!-- Canvas Frame -->
  <rect width="1200" height="360" rx="10" fill="#020306" stroke="#172033" stroke-width="1"/>
  <rect width="1200" height="360" rx="10" fill="url(#cardGridPattern)"/>

  <!-- ==================== CARD 1: Enterprise Automation & Integration ==================== -->
  <g transform="translate(30, 20)">
    <rect width="555" height="150" rx="8" fill="url(#cardBg)" stroke="#1a2538" stroke-width="1"/>
    <line x1="0" y1="0" x2="555" y2="0" stroke="url(#cardTopBorder)" stroke-width="1.5"/>
    
    <text x="24" y="36" class="card-title">Enterprise Automation &amp; Integration</text>
    
    <text x="24" y="66" class="card-desc">High-throughput synchronization pipelines, custom ERP &amp; CRM integration</text>
    <text x="24" y="86" class="card-desc">engines, distributed queue workers, and resilient backend orchestration.</text>
    
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" class="tag-text">POSTGRES</text>

      <rect x="88" y="0" width="58" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="117" y="15" text-anchor="middle" class="tag-text">REDIS</text>

      <rect x="154" y="0" width="66" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="187" y="15" text-anchor="middle" class="tag-text">DOCKER</text>

      <rect x="228" y="0" width="72" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="264" y="15" text-anchor="middle" class="tag-text">FASTAPI</text>

      <rect x="308" y="0" width="58" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="337" y="15" text-anchor="middle" class="tag-text">NGINX</text>
    </g>
  </g>

  <!-- ==================== CARD 2: Reverse Engineering & Systems ==================== -->
  <g transform="translate(615, 20)">
    <rect width="555" height="150" rx="8" fill="url(#cardBg)" stroke="#1a2538" stroke-width="1"/>
    <line x1="0" y1="0" x2="555" y2="0" stroke="url(#cardTopBorder)" stroke-width="1.5"/>
    
    <text x="24" y="36" class="card-title">Reverse Engineering &amp; Low-Level Systems</text>
    
    <text x="24" y="66" class="card-desc">Binary disassembly, communication protocol dissection, memory mapping,</text>
    <text x="24" y="86" class="card-desc">and low-level interfacing with undocumented hardware &amp; legacy platforms.</text>
    
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="64" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="32" y="15" text-anchor="middle" class="tag-text">C / C++</text>

      <rect x="72" y="0" width="76" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="110" y="15" text-anchor="middle" class="tag-text">GDB / IDA</text>

      <rect x="156" y="0" width="86" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="199" y="15" text-anchor="middle" class="tag-text">PROTOCOLS</text>

      <rect x="250" y="0" width="58" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="279" y="15" text-anchor="middle" class="tag-text">LINUX</text>

      <rect x="316" y="0" width="72" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="352" y="15" text-anchor="middle" class="tag-text">SOCKETS</text>
    </g>
  </g>

  <!-- ==================== CARD 3: Real-Time Graphics & Fluid Physics ==================== -->
  <g transform="translate(30, 190)">
    <rect width="555" height="150" rx="8" fill="url(#cardBg)" stroke="#1a2538" stroke-width="1"/>
    <line x1="0" y1="0" x2="555" y2="0" stroke="url(#cardTopBorder)" stroke-width="1.5"/>
    
    <text x="24" y="36" class="card-title">Real-Time Graphics &amp; Fluid Physics</text>
    
    <text x="24" y="66" class="card-desc">Mathematical signed distance fields (SDF), GPU metaballs, raymarching,</text>
    <text x="24" y="86" class="card-desc">custom GLSL compute shaders, and interactive WebGL2 pipeline rendering.</text>
    
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="72" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="36" y="15" text-anchor="middle" class="tag-text">WEBGL2</text>

      <rect x="80" y="0" width="76" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="118" y="15" text-anchor="middle" class="tag-text">THREE.JS</text>

      <rect x="164" y="0" width="98" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="213" y="15" text-anchor="middle" class="tag-text">GLSL SHADERS</text>

      <rect x="270" y="0" width="76" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="308" y="15" text-anchor="middle" class="tag-text">SDF MATH</text>
    </g>
  </g>

  <!-- ==================== CARD 4: Edge Computer Vision & IoT ==================== -->
  <g transform="translate(615, 190)">
    <rect width="555" height="150" rx="8" fill="url(#cardBg)" stroke="#1a2538" stroke-width="1"/>
    <line x1="0" y1="0" x2="555" y2="0" stroke="url(#cardTopBorder)" stroke-width="1.5"/>
    
    <text x="24" y="36" class="card-title">Edge Computer Vision &amp; Embedded Hardware</text>
    
    <text x="24" y="66" class="card-desc">Direction-aware edge inference, C++ embedded microcontroller firmware,</text>
    <text x="24" y="86" class="card-desc">real-time neural tracking (YOLOv8 + BoT-SORT), and telemetry streaming.</text>
    
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="66" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="33" y="15" text-anchor="middle" class="tag-text">YOLOV8</text>

      <rect x="74" y="0" width="74" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="111" y="15" text-anchor="middle" class="tag-text">BOT-SORT</text>

      <rect x="156" y="0" width="86" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="199" y="15" text-anchor="middle" class="tag-text">ESP32-CAM</text>

      <rect x="250" y="0" width="66" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="283" y="15" text-anchor="middle" class="tag-text">OPENCV</text>

      <rect x="324" y="0" width="74" height="22" rx="4" fill="#081426" stroke="#162e52" stroke-width="1"/>
      <text x="361" y="15" text-anchor="middle" class="tag-text">FREERTOS</text>
    </g>
  </g>
</svg>