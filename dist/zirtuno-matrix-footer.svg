<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050711"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E3FE" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00E3FE" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="footerWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#00E3FE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="90" fill="url(#footerBg)" />

  <!-- Liquid Meniscus Waves (Top) -->
  <g opacity="0.9">
    <path fill="url(#footerWave1)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="
          M0 0 L0 45 Q300 75 600 35 T1200 50 L1200 0 Z;
          M0 0 L0 30 Q300 20 600 60 T1200 30 L1200 0 Z;
          M0 0 L0 50 Q300 45 600 20 T1200 60 L1200 0 Z;
          M0 0 L0 45 Q300 75 600 35 T1200 50 L1200 0 Z"
      />
    </path>
    <path fill="url(#footerWave2)">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="
          M0 0 L0 25 Q400 15 700 50 T1200 25 L1200 0 Z;
          M0 0 L0 45 Q400 60 700 20 T1200 40 L1200 0 Z;
          M0 0 L0 20 Q400 35 700 55 T1200 25 L1200 0 Z;
          M0 0 L0 25 Q400 15 700 50 T1200 25 L1200 0 Z"
      />
    </path>
  </g>
</svg>