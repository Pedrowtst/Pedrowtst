<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="obsidianBgFooter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#06070e"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E3FE" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E3FE" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="footerWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00E3FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="footerGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#141c2e" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="0" cy="0" r="1.2" fill="#00E3FE" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .footer-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      fill: #475569;
    }
  </style>

  <rect width="1200" height="120" fill="url(#obsidianBgFooter)" />
  <rect width="1200" height="120" fill="url(#footerGrid)" />

  <!-- Liquid Meniscus Waves (Top) -->
  <g opacity="0.85">
    <path fill="url(#footerWave1)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="
          M0 0 L0 55 Q300 95 600 45 T1200 65 L1200 0 Z;
          M0 0 L0 40 Q300 25 600 75 T1200 40 L1200 0 Z;
          M0 0 L0 65 Q300 55 600 25 T1200 75 L1200 0 Z;
          M0 0 L0 55 Q300 95 600 45 T1200 65 L1200 0 Z"
      />
    </path>
    <path fill="url(#footerWave2)">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="
          M0 0 L0 35 Q400 15 700 65 T1200 30 L1200 0 Z;
          M0 0 L0 60 Q400 75 700 25 T1200 55 L1200 0 Z;
          M0 0 L0 30 Q400 45 700 75 T1200 35 L1200 0 Z;
          M0 0 L0 35 Q400 15 700 65 T1200 30 L1200 0 Z"
      />
    </path>
  </g>

  <!-- HUD Technical Diagnostics Bottom Bar -->
  <g opacity="0.8">
    <line x1="40" y1="95" x2="1160" y2="95" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="107" class="footer-text">[ END TRANSMISSION // PROTOCOL TERMINATED ]</text>
    <text x="600" y="107" text-anchor="middle" class="footer-text">SHA256: 00E3FE7B9A2F...C84D</text>
    <text x="1160" y="107" text-anchor="end" class="footer-text">[ ZIRTUNO ARCHITECTURE CORE ]</text>
  </g>
</svg>